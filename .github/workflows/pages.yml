name: Publish iOS web app

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Check PWA JavaScript syntax
        run: node --check app.js

      - name: Prepare site files
        run: |
          mkdir -p site/Scratch_Urodzinowa_Misja/projekty
          mkdir -p site/Scratch_Urodzinowa_Misja/ilustracje
          cp index.html app.css app.js manifest.webmanifest sw.js apple-touch-icon.png site/
          cp Scratch_Urodzinowa_Misja/ilustracje/scene_party.png site/Scratch_Urodzinowa_Misja/ilustracje/
          cp Scratch_Urodzinowa_Misja/projekty/*.sb3 site/Scratch_Urodzinowa_Misja/projekty/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4